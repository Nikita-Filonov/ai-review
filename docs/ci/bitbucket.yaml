# ============================================
# Bitbucket Pipelines configuration for AI Review
# ============================================

image: nikitafilonov/ai-review:latest

clone:
  depth: full

options:
  size: 2x
  max-time: 30

pipelines:
  pull-requests:
    '**':
      - step:
          name: "Init pipeline"
          script:
            - echo "🚀 Starting Bitbucket AI Review pipeline initialization..."

  custom:
    ai-review-all:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (All)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run

    ai-review-inline:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Inline)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run-inline

    ai-review-context:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Context)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run-context

    ai-review-summary:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Summary)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run-summary

    ai-review-inline-reply:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Inline Reply)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run-inline-reply

    ai-review-summary-reply:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Summary Reply)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review run-summary-reply

    ai-review-clear:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Clear All)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review clear

    ai-review-clear-inline:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Clear Inline)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review clear-inline

    ai-review-clear-summary:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Clear Summary)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review clear-summary

    ai-review-clear-inline-reply:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Clear Inline Reply Requests)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review clear-inline-reply

    ai-review-clear-summary-reply:
      - variables:
          - name: BITBUCKET_PR_ID
            description: "Enter Pull Request ID manually (e.g., 42)"
      - step:
          name: "AI Review (Clear Summary Reply Requests)"
          script:
            - export VCS__PIPELINE__WORKSPACE="$BITBUCKET_WORKSPACE"
            - export VCS__PIPELINE__REPO_SLUG="$BITBUCKET_REPO_SLUG"
            - export VCS__PIPELINE__PULL_REQUEST_ID="$BITBUCKET_PR_ID"
            - ai-review show-config
            - ai-review clear-summary-reply
